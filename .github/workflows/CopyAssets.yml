name: Copy Assets

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of this repository to commit and push to (leave empty to use the checked-out branch)
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  copy:
    name: Copy configured assets
    runs-on: windows-latest

    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone and copy configured assets
        shell: pwsh
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # An empty PowerShell argument disappears, so only pass --branch when the input is set.
          $branchArgs = @()
          if ("$env:BRANCH") { $branchArgs += @("--branch", "$env:BRANCH") }
          python .github\tools\CopyAssets.py @branchArgs --push
