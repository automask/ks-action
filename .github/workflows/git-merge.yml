name: Git Merge Data

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to clone and push to
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  merge:
    name: Merge data into repository
    runs-on: windows-latest

    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write data and push
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          python .github\tools\GitMerge.py `
            --repo "https://github.com/$env:REPOSITORY.git" `
            --branch "$env:BRANCH" `
            --work-dir Deps\git-merge
